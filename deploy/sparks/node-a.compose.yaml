# Node A: the answer model, and nothing else, so every chat has the memory it
# needs for concurrent conversations. See docs/sparks-setup.md.
#
# On the node, from the repository root:
#   docker compose --env-file deploy/sparks/.env -f deploy/sparks/node-a.compose.yaml up -d
#
# One vLLM process per model. On the Spark's unified memory
# --gpu-memory-utilization is a share of all 128 GB, so shares on one node must
# add up to less than 1.

name: chatbot-spark-a

x-vllm: &vllm
  image: ${VLLM_IMAGE:?Set VLLM_IMAGE in deploy/sparks/.env}
  restart: unless-stopped
  ipc: host
  gpus: all
  # The entrypoint is set so the same arguments work whichever vLLM image is used.
  entrypoint: ["vllm", "serve"]
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
    HF_HOME: /models/huggingface
  volumes:
    - ${MODEL_CACHE:-/srv/models}:/models

services:
  answer:
    <<: *vllm
    # About 70 GB of NVFP4 weights, leaving about 39 GB of KV cache for
    # conversations running at once.
    command: >-
      ${ANSWER_MODEL:?Set ANSWER_MODEL}
      --served-model-name ${ANSWER_SERVED_NAME:?Set ANSWER_SERVED_NAME}
      --host 0.0.0.0 --port 8000
      --api-key ${VLLM_API_KEY:?Set VLLM_API_KEY}
      --gpu-memory-utilization 0.85
      --max-model-len ${ANSWER_MAX_MODEL_LEN:-32768}
      --enable-prefix-caching
      ${ANSWER_EXTRA_ARGS:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Loading a large model from disk takes minutes the first time.
      start_period: 20m
